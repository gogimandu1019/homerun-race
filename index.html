<script>
(() => {
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = cv.width, H = cv.height;   // 화면에 맞춰 layout()이 바꿈 (PC 960×600, 세로 모바일 600×세로길이)
const $ = id => document.getElementById(id);

const PARK = { line:100, center:122, fence:3.6 };
// 둥근 외야 펜스: 파울라인 100m → 중앙 122m로 부드럽게 이어지는 곡선 (좌·우중간 약 113m)
// 방향각(도): 0 = 중앙, -45 = 좌측 파울라인, +45 = 우측 파울라인
function fenceDist(deg){
  const t = Math.cos(clamp(Math.abs(deg), 0, 45) * 2 * Math.PI / 180);   // 중앙 1 → 파울라인 0
  return PARK.line + (PARK.center - PARK.line) * Math.pow(Math.max(0, t), 1.5);
}

// ===== 게임 상수 =====
const TOTAL = 15, EVENTS = 5;
const WINDOW = 150;        // 스윙 가능 범위 (ms, 도착 시점 기준 ±)
// 난이도별 설정: slow=투구 감속 배율(클수록 느림), q=타이밍 허용 폭, perfect/good=판정 범위(ms)
const MODES = {
  easy: { name:'이지', slow:2.6, kmh:[115,140], q:180, perfect:30, good:70, v0:114, vq:78, lsd:4.5 },
  hard: { name:'하드', slow:1.7, kmh:[130,155], q:110, perfect:14, good:38, v0:104, vq:84, lsd:6 },
};
// 유니폼 팀: 실제 구단명·로고 대신 지역+닉네임을 씁니다 (id는 DB에 저장되는 내부 코드라 바꾸지 않음)
// no=등번호(그래픽 전용), body=상의, num=등번호 색, helmet=헬멧, line=흰 유니폼 테두리, stripe=줄무늬
const UNIFORMS = [
  { id:'kt', name:'수원 마법사', short:'마법사', no:6,       body:'#1a1a1a', num:'#ffffff', helmet:'#1a1a1a' },
  { id:'samsung', name:'대구 사자', short:'사자', no:36, body:'#1428a0', num:'#ffffff', helmet:'#1428a0' },
  { id:'kia', name:'광주 호랑이', short:'호랑이', no:7,  body:'#d6001c', num:'#ffffff', helmet:'#1a1a1a' },
  { id:'lg', name:'서울 쌍둥이', short:'쌍둥이', no:33,     body:'#f4f4f6', num:'#1a1a1a', helmet:'#1a1a1a', stripe:'#1a1a1a', line:'#9aa6bd' },
  { id:'doosan', name:'서울 곰돌이', short:'곰돌이', no:31,   body:'#f4f4f6', num:'#131230', helmet:'#131230', line:'#9aa6bd' },
  { id:'ssg', name:'인천 강아지', short:'강아지', no:14,    body:'#ce0e2d', num:'#e6b422', helmet:'#e6b422' },
  { id:'lotte', name:'부산 갈매기', short:'갈매기', no:10, body:'#041e42', num:'#ffffff', helmet:'#041e42' },
  { id:'nc', name:'창원 공룡', short:'공룡', no:2,   body:'#7ab8e6', num:'#0b2a55', helmet:'#0b2a55' },
  { id:'hanwha', name:'대전 독수리', short:'독수리', no:52,   body:'#f37321', num:'#ffffff', helmet:'#1a1a1a' },
  { id:'kiwoom', name:'서울 영웅', short:'영웅', no:51, body:'#820024', num:'#ffffff', helmet:'#820024' },
];
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e) { return d; } },
                set(k, v){ try { localStorage.setItem(k, v); } catch(e) {} } };
let mode = MODES[store.get('hr_mode','easy')] ? store.get('hr_mode','easy') : 'easy';
let uniform = UNIFORMS.find(u => u.id === store.get('hr_uniform','')) || UNIFORMS[0];
const M = () => MODES[mode];
// 등번호: 비워두면 팀 기본 번호, 직접 입력하면 모든 팀에서 그 번호 (그래픽 전용, 이 브라우저에만 저장)
let myNo = /^\d{1,2}$/.test(store.get('hr_no','')) ? store.get('hr_no','') : '';
const jerseyNo = () => myNo !== '' ? myNo : String(uniform.no);

let state = 'title', pitchIdx = 0, score = 0, hrCount = 0, results = [], eventSet = new Set();
let pitch = null, flight = null, banner = null, swingT = -1, stateT = 0;
let best = 0;
function loadBest(){ best = +store.get('hr_best_' + mode, 0) || 0; $('best').textContent = best.toLocaleString(); $('bestk').textContent = `최고 기록 (${M().name})`; }

const rand = (a,b) => a + Math.random()*(b-a);
const gauss = () => { let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));

// ===== 타구 물리 (공기저항 + 백스핀 양력 근사) =====
function simulate(kmh, launchDeg, sprayDeg){
  const K = 0.0056, LIFT = 0.035, dt = 0.01;
  let v = kmh/3.6, a = launchDeg*Math.PI/180, vr = v*Math.cos(a), vh = v*Math.sin(a), r = 0, h = 1.0, t = 0;
  const F = fenceDist(sprayDeg); let hAtFence = null; const path = [{r,h,t}];
  while (h > 0 && t < 12) {
    const s = Math.hypot(vr, vh);
    vr += (-K*s*vr)*dt; vh += (-9.8 - K*s*vh + LIFT*s)*dt;
    const pr = r, ph = h; r += vr*dt; h += vh*dt; t += dt;
    if (hAtFence === null && pr < F && r >= F) hAtFence = ph + (h-ph)*(F-pr)/(r-pr);
    path.push({r, h:Math.max(0,h), t});
  }
  const homer = Math.abs(sprayDeg) <= 45 && hAtFence !== null && hAtFence > PARK.fence;
  return { path, dist:r, homer, fence:F, hAtFence, maxH:Math.max(...path.map(p=>p.h)), dur:t };
}

// ===== HUD =====
function renderDots(){
  const box = $('balls'); box.innerHTML = '';
  for (let i=0;i<TOTAL;i++){
    const d = document.createElement('div'); d.className = 'dot';
    if (eventSet.has(i)) { d.classList.add('ev'); }
    const r = results[i];
    if (r) d.classList.add(r.homer ? 'hr' : 'out');
    if (i === pitchIdx && state !== 'end' && state !== 'title') d.classList.add('cur');
    if (eventSet.has(i) && !r) { d.textContent = '2'; d.style.color = 'var(--gold)'; }
    box.appendChild(d);
  }
  $('score').textContent = score.toLocaleString();
  $('hrs').textContent = hrCount;
}

// ===== 흐름 =====
function startGame(){
  pitchIdx = 0; score = 0; hrCount = 0; results = [];
  eventSet = new Set(); while (eventSet.size < EVENTS) eventSet.add(Math.floor(Math.random()*TOTAL));
  $('overlay').classList.add('hidden');
  nextPitch();
}
function nextPitch(){
  if (pitchIdx >= TOTAL) return endGame();
  const kmh = Math.round(rand(M().kmh[0], M().kmh[1]));
  const travel = 18.44/(kmh/3.6)*M().slow*1000;
  pitch = {
    kmh, travel, ev: eventSet.has(pitchIdx),
    windup: rand(550, 1000),
    tx: rand(-0.15, 0.15), ty: rand(0.6, 1.0), // 스트라이크존 도착 위치
    swung:false, hit:false, whiff:false,
  };
  swingT = -1; flight = null;
  setState('pitch');
  banner = pitch.ev ? { text:'⭐ 점수 2배 이벤트! ⭐', color:'#ffc83d', until: performance.now()+1500 } : null;
  renderDots();
}
function setState(s){ state = s; stateT = performance.now(); }

function swing(){
  if (state !== 'pitch' || pitch.swung) return;
  const now = performance.now();
  const el = now - stateT - pitch.windup;          // 투구 후 경과
  if (el < -200) return;                           // 와인드업 중엔 무시
  pitch.swung = true; swingT = now;
  const e = el - pitch.travel;                     // + 늦음, - 빠름 (ms)
  if (Math.abs(e) > WINDOW) { pitch.whiff = true; pitch.err = e; return; }
  pitch.hit = true; pitch.err = e;
  const ae = Math.abs(e), m = M();
  const q = clamp(1 - Math.pow(ae/m.q, 1.4), 0, 1);  // 타이밍 품질
  let kmh = clamp(m.v0 + m.vq*q + gauss()*4, 70, 190);
  let launch = 27 + gauss()*m.lsd;
  if (q < 0.8) launch += (Math.random()<0.5?-1:1) * (1-q) * rand(10, 30);
  launch = clamp(launch, -10, 70);
  let spray = e*0.3 + gauss()*5;
  let sim = simulate(kmh, launch, spray);
  const label = ae <= m.perfect ? 'PERFECT!' : ae <= m.good ? 'GOOD' : (e < 0 ? '빠름' : '늦음');
  // PERFECT는 무조건 홈런: 홈런이 될 때까지 좋은 타구로 다시 굴림
  if (label === 'PERFECT!') {
    for (let i = 0; i < 30 && !sim.homer; i++) {
      kmh = Math.max(kmh, rand(176, 188)); launch = rand(24, 32); spray = clamp(spray, -38, 38);
      sim = simulate(kmh, launch, spray);
    }
    if (!sim.homer) { kmh = 186; launch = 28; spray = clamp(spray, -20, 20); sim = simulate(kmh, launch, spray); }
  }
  pitch.result = { kmh, launch, spray, sim, label };
  setTimeout(() => { flight = { start: performance.now(), ...pitch.result }; setState('flight'); }, 180);
}

function finishPitch(){
  const r = pitch.result;
  let rec;
  if (!pitch.hit) rec = { homer:false, dist:0, pts:0, ev:pitch.ev, note: pitch.swung ? '헛스윙' : '스트라이크' };
  else {
    const foul = Math.abs(r.spray) > 45;
    const d = Math.round(r.sim.dist*10)/10;
    const pts = r.sim.homer ? Math.round(d*100) * (pitch.ev ? 2 : 1) : 0;
    rec = { homer:r.sim.homer, dist:d, pts, ev:pitch.ev, note: foul ? '파울' : r.sim.homer ? '홈런' : (r.launch < 10 ? '땅볼' : r.sim.hAtFence !== null ? '펜스 직격' : '아웃'), kmh:r.kmh, launch:r.launch };
  }
  results[pitchIdx] = rec; score += rec.pts; if (rec.homer) hrCount++;
  setState('result'); pitch.rec = rec; renderDots();
  setTimeout(() => { pitchIdx++; nextPitch(); }, rec.homer ? 1500 : 900);
}

function endGame(){
  setState('end'); renderDots();
  let newBest = false;
  if (score > best) { best = score; newBest = true; store.set('hr_best_' + mode, best); }
  $('best').textContent = best.toLocaleString();
  const longest = Math.max(0, ...results.filter(r=>r.homer).map(r=>r.dist));
  let rows = results.map((r,i) => `<tr class="${r.homer?'hr':''}"><td>${i+1}${r.ev?'<b class="ev">2×</b>':''}</td><td>${r.note}</td><td>${r.dist?r.dist.toFixed(1)+'m':'-'}</td><td>${r.pts.toLocaleString()}</td></tr>`).join('');
  $('card').innerHTML = `<h1 class="endh">${newBest?'🏆 신기록!':'경기 종료'} <span class="tag">${M().name} 모드</span></h1>
    <p class="endscore"><b>${score.toLocaleString()}점</b> <span>홈런 ${hrCount} / ${TOTAL} · 최장거리 ${longest ? longest.toFixed(1)+'m' : '-'}</span></p>
    <div class="save"><input id="nm" maxlength="12" placeholder="이름 (최대 12자)" autocomplete="nickname"><button id="sv">점수 저장</button></div>
    <div class="msg" id="msg"></div>
    <div class="panels">
      <div class="panel">
        <div class="ph"><h3>📋 내 기록</h3><span class="sub">${teamCell(uniform.id)}</span></div>
        <div class="pb"><table class="mine"><tr><th>#</th><th>결과</th><th>거리</th><th>점수</th></tr>${rows}</table></div>
      </div>
      <div class="panel" id="lb"></div>
    </div>
    <div class="endbtns"><button id="go">다시 하기</button> <button id="home" class="ghost">처음으로</button></div>`;
  $('overlay').classList.remove('hidden');
  fitCardSoon();
  $('go').onclick = startGame;
  $('home').onclick = () => { pitch = null; swingT = -1; score = 0; hrCount = 0; results = []; eventSet = new Set(); setState('title'); showTitle(); renderDots(); };
  const nm = $('nm'), sv = $('sv');
  try { nm.value = localStorage.getItem('hr_name') || ''; } catch(e) {}
  sv.onclick = () => saveScore(nm.value, { score, homers:hrCount, longest, mode, team: uniform.id });
  nm.addEventListener('keydown', e => { if (e.key === 'Enter') sv.click(); });
  loadBoard($('lb'));
}

// ===== 랭킹 (Vercel API → Supabase) =====
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let myId = null;

let boardSort = 'score';   // 'score' | 'longest' | 'teams'
const teamOf = id => UNIFORMS.find(u => u.id === id);
const teamCell = id => { const t = teamOf(id); return t
  ? `<span class="team"><i style="background:${t.body}${t.line ? ';box-shadow:inset 0 0 0 1px ' + t.line : ''}"></i>${t.short}</span>`
  : '<span class="team none">-</span>'; };

// 랭킹 패널: 제목 + 점수/비거리 탭 + 표 (결과 화면, 시작 화면 공용)
async function loadBoard(el, limit = 10){
  if (!el) return;
  const head = `<div class="ph"><h3>🏆 ${M().name} 랭킹</h3><div class="tabs">
      <button data-s="score" class="${boardSort==='score'?'on':''}">점수</button>
      <button data-s="longest" class="${boardSort==='longest'?'on':''}">비거리</button>
      <button data-s="teams" class="${boardSort==='teams'?'on':''}">팀</button></div></div>`;
  const wire = () => el.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { boardSort = b.dataset.s; loadBoard(el, limit); });
  el.innerHTML = head + '<div class="pb"><p class="msg">불러오는 중…</p></div>'; wire();
  try {
    if (boardSort === 'teams') {
      const r = await fetch(`/api/scores?mode=${mode}&view=teams`);
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || '');
      const teams = j.teams || [];
      const mine = uniform.id;
      const rows = teams.length
        ? teams.map((t,i) => { const u = teamOf(t.team) || {}; return `<tr class="${t.team===mine?'me':''}"><td>${i+1}</td><td>${teamCell(t.team).replace(u.short || '', u.name || u.short || '')}</td><td>${t.games}</td><td>${t.homers}</td><td>${Number(t.total).toLocaleString()}</td></tr>`; }).join('')
        : '<tr><td colspan="5" class="empty">아직 기록이 없어요</td></tr>';
      setTimeout(fitCard);
    el.querySelector('.pb').innerHTML = `<table class="teams"><tr><th>#</th><th>팀</th><th>판</th><th>홈런</th><th>총점</th></tr>${rows}</table>`;
      return;
    }
    const r = await fetch(`/api/scores?mode=${mode}&sort=${boardSort}&limit=${limit}`);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || '');
    const scores = j.scores || [], byDist = boardSort === 'longest';
    const th = `<tr><th>#</th><th>팀</th><th>이름</th>${byDist ? '<th>비거리</th>' : '<th>홈런</th><th>점수</th>'}</tr>`;
    const rows = scores.length
      ? scores.map((s,i) => `<tr class="${s.id===myId?'me':''}"><td>${i+1}</td><td>${teamCell(s.team)}</td><td class="nm">${esc(s.name)}</td>${
          byDist ? `<td>${Number(s.longest).toFixed(1)}m</td>` : `<td>${s.homers}</td><td>${s.score.toLocaleString()}</td>`}</tr>`).join('')
      : `<tr><td colspan="${byDist?4:5}" class="empty">아직 기록이 없어요</td></tr>`;
    el.querySelector('.pb').innerHTML = `<table class="${byDist?'dist':'pts'}">${th}${rows}</table>`;
    setTimeout(fitCard);
  } catch(e) {
    el.querySelector('.pb').innerHTML = '<p class="msg">' + esc(e.message || '랭킹 서버에 연결할 수 없어요') + '</p>';
    setTimeout(fitCard);
  }
}

async function saveScore(name, data){
  const msg = $('msg'), sv = $('sv');
  name = name.trim();
  if (!name) { msg.textContent = '이름을 입력해 주세요.'; $('nm').focus(); return; }
  sv.disabled = true; msg.textContent = '저장 중…';
  try {
    const r = await fetch('/api/scores', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, ...data }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || '저장에 실패했어요.');
    try { localStorage.setItem('hr_name', name); } catch(e) {}
    myId = j.saved && j.saved.id;
    msg.innerHTML = j.rank ? `저장 완료! 현재 <b style="color:#ffc83d">${j.rank}위</b>` : '저장 완료!';
    $('nm').disabled = true; sv.textContent = '저장됨';
    loadBoard($('lb'));
  } catch(e) {
    msg.textContent = e.message && e.message !== 'Failed to fetch' ? e.message : '랭킹 서버에 연결할 수 없어요.';
    sv.disabled = false;
  }
}

// ===== 입력 =====
cv.addEventListener('pointerdown', e => { e.preventDefault(); swing(); });
window.addEventListener('keydown', e => { if (e.target instanceof HTMLInputElement) return; if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (state==='pitch') swing(); } });

// ===== 렌더: 타석 시점 =====
let HOR = 210;   // 지평선 높이: 타자가 화면 아래쪽에 오도록 H에 맞춰 바뀜
const FOC = 750, CAMD = 3, CAMH = 1.2;
const proj = (x, y, z) => { const s = FOC/(z+CAMD); return { x: W/2 + x*s, y: HOR + (CAMH-y)*s, s }; };

function drawPitchView(now){
  // 하늘/관중석
  let g = ctx.createLinearGradient(0,0,0,HOR); g.addColorStop(0,'#0a1630'); g.addColorStop(1,'#1d3360');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,HOR);
  // 관중석 점
  const stH = Math.max(70, Math.round((HOR - 60) * 0.55));   // 세로 화면에서는 관중석을 높게
  ctx.fillStyle = '#2b3f6b'; ctx.fillRect(0, HOR-stH, W, stH);
  const fans = Math.round(220 * stH / 70);
  for (let i=0;i<fans;i++){ const x=(i*97)%W, y=HOR-stH+4+((i*37)%(stH-12)); ctx.fillStyle=['#6a7fae','#c9d3ea','#e2544f','#4fd1ff'][i%4]; ctx.fillRect(x,y,3,3); }
  // 외야 펜스
  ctx.fillStyle = '#123f6e'; ctx.fillRect(0, HOR-14, W, 14);
  ctx.fillStyle = '#ffc83d'; ctx.fillRect(0, HOR-14, W, 2);
  // 잔디
  g = ctx.createLinearGradient(0,HOR,0,H); g.addColorStop(0,'#1f6b34'); g.addColorStop(1,'#2f8f45');
  ctx.fillStyle = g; ctx.fillRect(0,HOR,W,H-HOR);
  for (let i=0;i<10;i++){ ctx.fillStyle = i%2?'rgba(255,255,255,.035)':'rgba(0,0,0,.04)'; const y0 = HOR + Math.pow(i/10,2)*(H-HOR), y1 = HOR + Math.pow((i+1)/10,2)*(H-HOR); ctx.fillRect(0,y0,W,y1-y0); }
  // 내야 흙
  const m = proj(0,0,18.44), pl = proj(0,0,0);
  ctx.fillStyle = '#b07a48';
  ctx.beginPath(); ctx.ellipse(m.x, m.y, 60, 9, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(pl.x, pl.y+20, 260, 70, 0, 0, Math.PI*2); ctx.fill();
  // 파울라인
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(pl.x, pl.y); ctx.lineTo(-400, HOR); ctx.moveTo(pl.x, pl.y); ctx.lineTo(W+400, HOR); ctx.stroke();
  // 홈플레이트
  ctx.fillStyle = '#fff'; ctx.beginPath();
  ctx.moveTo(pl.x-34, pl.y-8); ctx.lineTo(pl.x+34, pl.y-8); ctx.lineTo(pl.x+34, pl.y+4); ctx.lineTo(pl.x, pl.y+16); ctx.lineTo(pl.x-34, pl.y+4); ctx.closePath(); ctx.fill();

  // 투수
  const el = now - stateT - (pitch ? pitch.windup : 0);
  const wind = pitch ? clamp(1 + el/pitch.windup, 0, 1) : 0;
  const px = m.x, py = m.y;
  ctx.fillStyle = '#e8edf6';
  ctx.fillRect(px-6, py-46, 12, 30);              // 몸
  ctx.beginPath(); ctx.arc(px, py-52, 6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1b2a4a'; ctx.fillRect(px-7, py-58, 14, 4);
  ctx.strokeStyle = '#e8edf6'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(px-3, py-16); ctx.lineTo(px-7, py); ctx.moveTo(px+3, py-16); ctx.lineTo(px+7 - (wind>.5&&el<0?6:0), py - (wind>.5&&el<0?10:0)); ctx.stroke();
  const armA = el < 0 ? -Math.PI/2 - wind*2.2 : -Math.PI/2 + 1.6;
  ctx.beginPath(); ctx.moveTo(px+5, py-42); ctx.lineTo(px+5+Math.cos(armA)*16, py-42+Math.sin(armA)*16); ctx.stroke();

  // 스트라이크존
  const zt = proj(-0.22, 1.1, 0), zb = proj(0.22, 0.5, 0);
  ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2; ctx.setLineDash([6,6]);
  ctx.strokeRect(zt.x, zt.y, zb.x-zt.x, zb.y-zt.y); ctx.setLineDash([]);

  // 타자 (우타자: 포수 시점 왼쪽)
  drawBatter(now);

  // 공
  if (pitch && state === 'pitch' && el >= 0 && !(pitch.hit)) {
    const p = el / pitch.travel;
    if (p <= 1.35) {
      const z = 18.44*(1-p), x = 0.25 + (pitch.tx-0.25)*Math.min(1,p), y = 1.9 + (pitch.ty-1.9)*Math.min(1,p) - 0.15*Math.sin(Math.min(1,p)*Math.PI);
      const b = proj(x, y, Math.max(z, -2.4));
      const tgt = proj(pitch.tx, pitch.ty, 0);
      // 타이밍 링
      if (p < 1) {
        const rr = 14 + 170*(1-p);
        ctx.strokeStyle = pitch.ev ? 'rgba(255,200,61,.85)' : 'rgba(79,209,255,.75)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(tgt.x, tgt.y, rr, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(tgt.x, tgt.y, 14, 0, Math.PI*2); ctx.stroke();
      }
      const r = Math.max(2, 0.037*b.s*1.7);
      if (pitch.ev) { ctx.shadowColor = '#ffc83d'; ctx.shadowBlur = 18; }
      ctx.fillStyle = pitch.ev ? '#ffd966' : '#fff';
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#d33'; ctx.lineWidth = Math.max(1, r/6);
      ctx.beginPath(); ctx.arc(b.x - r*0.9, b.y, r*0.7, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x + r*0.9, b.y, r*0.7, Math.PI-0.9, Math.PI+0.9); ctx.stroke();
    } else if (!pitch.done) {
      pitch.done = true; finishPitch();
    }
  }
  // 정보
  if (pitch) {
    ctx.fillStyle = 'rgba(0,0,0,.45)'; roundRect(16, 16, 200, 56, 10); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`${pitchIdx+1}구 / ${TOTAL}`, 30, 42);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#b8c4da';
    ctx.fillText(el >= 0 ? `구속 ${pitch.kmh} km/h` : '와인드업…', 30, 62);
  }
  if (pitch && pitch.swung) {
    const txt = pitch.whiff ? '헛스윙!' : pitch.result.label;
    const col = pitch.whiff ? '#ff6b66' : txt === 'PERFECT!' ? '#ffc83d' : txt === 'GOOD' ? '#46d37a' : '#9fd8ff';
    bigText(txt, col, H*0.78);
  }
  if (state === 'result' && pitch && !pitch.swung) bigText('스트라이크!', '#ff6b66', H*0.78);
}

function drawBatter(now){
  const bx = W/2 - 175, by = HOR + 260;
  let sw = 0; // 0~1 스윙 진행
  if (swingT > 0) sw = clamp((now - swingT)/120, 0, 1);
  ctx.save(); ctx.translate(bx, by);
  // 다리
  ctx.strokeStyle = '#d9dfeb'; ctx.lineWidth = 16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(-24, 110); ctx.moveTo(14, 0); ctx.lineTo(36, 110); ctx.stroke();
  // 몸
  ctx.fillStyle = uniform.body; roundRect(-30, -110, 60, 115, 18); ctx.fill();
  if (uniform.stripe) {   // 핀스트라이프
    ctx.save(); ctx.clip(); ctx.fillStyle = uniform.stripe;
    for (let x = -28; x < 30; x += 8) ctx.fillRect(x, -110, 1.6, 115);
    ctx.restore(); roundRect(-30, -110, 60, 115, 18);
  }
  if (uniform.line) { ctx.strokeStyle = uniform.line; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.fillStyle = uniform.num; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(jerseyNo(), 0, -45);
  // 헬멧
  ctx.fillStyle = uniform.helmet; ctx.beginPath(); ctx.arc(4, -132, 26, Math.PI, 0); ctx.fill(); ctx.fillRect(-22, -134, 52, 12);
  // 배트
  const ang = -2.3 + sw * 3.3;
  ctx.translate(18, -82); ctx.rotate(ang);
  ctx.fillStyle = '#c99a5b'; ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(150,-8); ctx.lineTo(150,8); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#222'; ctx.fillRect(-8,-5,18,10);
  ctx.restore(); ctx.lineCap = 'butt';
}

// ===== 렌더: 구장 시점 (위에서) =====
let HX = W/2, HY = H - 34, SC = (H - 70)/140;
// 캔버스 크기가 바뀌면 타석·구장 기준점을 다시 계산
function recalcScene(){
  HOR = H - 390;
  SC = Math.min((H - 70) / 140, (W / 2 - 8) / 102);
  HX = W / 2; HY = Math.min(H - 34, (H + 135 * SC) / 2);
}
const fp = (r, deg) => { const a = deg*Math.PI/180; return { x: HX + r*Math.sin(a)*SC, y: HY - r*Math.cos(a)*SC }; };

function drawField(){
  ctx.fillStyle = '#0c1a2c'; ctx.fillRect(0,0,W,H);
  // 관중석
  ctx.fillStyle = '#1b2a44';
  ctx.beginPath(); ctx.moveTo(HX, HY);
  for (let d=-52; d<=52; d+=1) { const p = fp(fenceDist(clamp(d,-45,45)) + 30, d); ctx.lineTo(p.x, p.y); }
  ctx.closePath(); ctx.fill();
  // 잔디
  ctx.fillStyle = '#2a8a43'; ctx.beginPath(); ctx.moveTo(HX, HY);
  for (let d=-45; d<=45; d+=0.5) { const p = fp(fenceDist(d), d); ctx.lineTo(p.x, p.y); }
  ctx.closePath(); ctx.fill();
  // 잔디 무늬
  ctx.save(); ctx.clip();
  for (let r=10; r<130; r+=10) { ctx.strokeStyle = (r/10)%2 ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.05)'; ctx.lineWidth = 10*SC; ctx.beginPath(); ctx.arc(HX, HY, (r+5)*SC, Math.PI*1.2, Math.PI*1.8); ctx.stroke(); }
  ctx.restore();
  // 내야
  const b = 27.43;
  ctx.save(); ctx.beginPath(); ctx.moveTo(HX, HY);
  for (let d=-45; d<=45; d+=1) { const p = fp(60, d); ctx.lineTo(p.x, p.y); } ctx.closePath(); ctx.clip();
  const mc = fp(18.44, 0); ctx.fillStyle = '#b07a48'; ctx.beginPath(); ctx.arc(mc.x, mc.y, 29*SC, 0, Math.PI*2); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#2a8a43'; ctx.beginPath();
  const p1 = fp(b-4,-45), p2 = fp((b-4)*Math.SQRT2,0), p3 = fp(b-4,45), p0 = fp(3,0);
  ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  [fp(b,-45), fp(b*Math.SQRT2,0), fp(b,45)].forEach(p => ctx.fillRect(p.x-3, p.y-3, 6, 6));
  const mo = fp(18.44, 0); ctx.fillStyle = '#b07a48'; ctx.beginPath(); ctx.arc(mo.x, mo.y, 2.7*SC, 0, Math.PI*2); ctx.fill();
  // 파울라인
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  [-45,45].forEach(d => { const p = fp(fenceDist(d)+28, d); ctx.beginPath(); ctx.moveTo(HX,HY); ctx.lineTo(p.x,p.y); ctx.stroke(); });
  // 펜스
  ctx.strokeStyle = '#1b5fa8'; ctx.lineWidth = 6; ctx.beginPath();
  for (let d=-45; d<=45; d+=0.5) { const p = fp(fenceDist(d), d); d===-45 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y); } ctx.stroke();
  ctx.strokeStyle = '#ffc83d'; ctx.lineWidth = 1.5; ctx.stroke();

  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  // 홈플레이트
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(HX, HY, 3, 0, Math.PI*2); ctx.fill();
  // 이전 홈런 낙구 지점
  results.forEach(r => { if (r && r.homer && r.land) { ctx.fillStyle = r.ev ? 'rgba(255,200,61,.6)' : 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(r.land.x, r.land.y, 3, 0, Math.PI*2); ctx.fill(); } });
}

function drawFlight(now){
  drawField();
  const f = flight, sim = f.sim, path = sim.path;
  const speed = 2.8; // 재생 배속
  const t = (now - f.start)/1000 * speed;
  let i = path.findIndex(p => p.t >= t); if (i < 0) i = path.length-1;
  const cur = path[i];
  // 궤적
  ctx.strokeStyle = pitch.ev ? 'rgba(255,200,61,.8)' : 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.setLineDash([4,4]);
  ctx.beginPath();
  for (let j=0;j<=i;j+=2){ const g = fp(path[j].r, f.spray); const y = g.y - path[j].h*SC*0.9; j ? ctx.lineTo(g.x, y) : ctx.moveTo(g.x, y); }
  ctx.stroke(); ctx.setLineDash([]);
  // 그림자 + 공
  const gp = fp(cur.r, f.spray);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(gp.x, gp.y, 5, 3, 0, 0, Math.PI*2); ctx.fill();
  const r = 4 + cur.h*0.18;
  if (pitch.ev) { ctx.shadowColor = '#ffc83d'; ctx.shadowBlur = 16; }
  ctx.fillStyle = pitch.ev ? '#ffd966' : '#fff';
  ctx.beginPath(); ctx.arc(gp.x, gp.y - cur.h*SC*0.9, r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
  // 실시간 거리
  infoBox([`${cur.r.toFixed(1)} m`, `타구속도 ${f.kmh.toFixed(0)} km/h · 발사각 ${f.launch.toFixed(0)}° · ${f.label}`]);
  if (i === path.length-1 && state === 'flight') {
    pitch.landPt = gp;
    finishPitch();
  }
}

function drawResult(now){
  if (!pitch.hit) { drawPitchView(now); return; }
  drawField();
  const f = flight, rec = pitch.rec, gp = pitch.landPt;
  if (rec.homer) rec.land = gp;
  // 궤적 전체
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.setLineDash([4,4]); ctx.beginPath();
  f.sim.path.forEach((p,j) => { if (j%2) return; const g = fp(p.r, f.spray); const y = g.y - p.h*SC*0.9; j ? ctx.lineTo(g.x,y) : ctx.moveTo(g.x,y); });
  ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = rec.homer ? '#ffc83d' : '#ff6b66'; ctx.beginPath(); ctx.arc(gp.x, gp.y, 6, 0, Math.PI*2); ctx.fill();
  const age = (now - stateT)/1000;
  if (rec.homer) {
    // 폭죽
    for (let k=0;k<26;k++){ const a = k/26*Math.PI*2, d = 20 + age*180; ctx.fillStyle = ['#ffc83d','#4fd1ff','#ff6b66','#46d37a'][k%4]; ctx.globalAlpha = Math.max(0, 1-age/1.1); ctx.beginPath(); ctx.arc(gp.x+Math.cos(a)*d, gp.y+Math.sin(a)*d*0.7, 3.5, 0, Math.PI*2); ctx.fill(); }
    ctx.globalAlpha = 1;
    bigText('HOME RUN!', '#ffc83d', H*0.36);
    infoBox([`${rec.dist.toFixed(1)} m`, `+${rec.pts.toLocaleString()}점${rec.ev ? '  (2배 이벤트!)' : ''}`], true);
  } else {
    bigText(rec.note, '#ff6b66', H*0.36);
    infoBox([`${rec.dist.toFixed(1)} m`, '홈런 실패 · 0점'], true);
  }
}

function infoBox(lines, center){
  ctx.fillStyle = 'rgba(0,0,0,.55)'; const w = 360, x = center ? W/2 - w/2 : 16, y = center ? H*0.44 : 16;
  roundRect(x, y, w, 70, 12); ctx.fill();
  ctx.textAlign = center ? 'center' : 'left'; const tx = center ? W/2 : x+16;
  ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif'; ctx.fillText(lines[0], tx, y+36);
  ctx.fillStyle = '#c7d2e4'; ctx.font = '14px sans-serif'; ctx.fillText(lines[1], tx, y+58);
}
function bigText(t, col, y){
  ctx.textAlign = 'center'; ctx.font = '900 58px sans-serif';
  ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(t, W/2, y);
  ctx.fillStyle = col; ctx.fillText(t, W/2, y);
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function loop(now){
  ctx.clearRect(0,0,W,H);
  if (state === 'flight') drawFlight(now);
  else if (state === 'result') drawResult(now);
  else if (state === 'pitch') drawPitchView(now);
  else if (state === 'title') drawPitchView(now);
  else drawField();
  if (banner && now < banner.until && state === 'pitch') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(W/2-210, 90, 420, 56, 28); ctx.fill();
    ctx.fillStyle = banner.color; ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(banner.text, W/2, 128);
  }
  requestAnimationFrame(loop);
}

// ===== 화면 맞춤 =====
// PC: 게임 화면(960×600 비율)을 창 높이에 맞춰 줄여서 스크롤 없이 한 화면에.
// 세로 모바일: 캔버스를 세로로 길게(600×?) 그려 화면을 꽉 채우고, 시작·결과 화면은 전체 화면으로 띄움.
const root = document.documentElement;
let isMobile = false;
// 카드 내용이 늦게 채워지는 경우(랭킹 로딩, 글꼴)까지 고려해 여러 번 맞춤
function fitCardSoon(){ [0, 60, 400, 1200].forEach(t => setTimeout(fitCard, t)); }
function fitCard(){
  const card = $('card'), ov = $('overlay');
  if (!card || ov.classList.contains('hidden')) return;
  card.style.zoom = 1;
  const need = card.offsetHeight + 8, avail = ov.clientHeight;
  let z = Math.min(1, avail / need);
  if (isMobile) z = Math.max(z, 0.8);
  if (root.classList.contains('short')) z = Math.max(z, 0.62);   // 모바일은 글씨가 너무 작아지지 않게 (넘치면 살짝 스크롤)
  card.style.zoom = Math.max(0.55, z).toFixed(3);
}
function layout(){
  const vw = window.innerWidth, vh = window.innerHeight;
  isMobile = vw < 700 && vh > vw;
  root.classList.toggle('m', isMobile);
  root.classList.toggle('short', !isMobile && vh < 560);
  const hud = $('hud').offsetHeight, gap = isMobile ? 6 : 10, pad = isMobile ? 16 : 32;
  let nw, nh, cssW;
  if (isMobile) {
    cssW = vw - 16;
    const avail = vh - hud - pad - gap * 2 - document.querySelector('.foot').offsetHeight;
    nw = 600; nh = Math.round(clamp(600 * avail / cssW, 375, 1000));
  } else {
    const short = root.classList.contains('short');   // 가로 모드 휴대폰처럼 세로가 짧으면 안내문·푸터는 화면 아래로
    const others = hud + (short ? 0 : document.querySelector('.help').offsetHeight + document.querySelector('.foot').offsetHeight);
    const avail = vh - pad - others - gap * 3 - 20;
    nw = 960; nh = 600;
    cssW = Math.max(320, Math.min(960, vw - 32, avail * 1.6));
  }
  root.style.setProperty('--gw', Math.floor(cssW) + 'px');
  if (cv.width !== nw || cv.height !== nh) { cv.width = W = nw; cv.height = H = nh; recalcScene(); }
  fitCard();
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

showTitle(); renderDots(); layout(); requestAnimationFrame(loop);
})();
</script>
